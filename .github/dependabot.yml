version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The version tag on this action is the Rust toolchain we install for
      # the MSRV job — pinned intentionally to our supported floor. Bump it
      # manually when we raise MSRV in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
