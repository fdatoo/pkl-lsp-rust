name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: pkl-lsp-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: pkl-lsp-aarch64-linux.tar.gz
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: pkl-lsp-x86_64-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: pkl-lsp-aarch64-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pkl-lsp-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64-linux)
        if: matrix.linker == 'aarch64-linux-gnu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: release-${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }} -p pkl-lsp

      - name: Stage artifact
        shell: bash
        run: |
          mkdir staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/pkl-lsp.exe staging/
          else
            cp target/${{ matrix.target }}/release/pkl-lsp staging/
          fi
          cp LICENSE.txt staging/ 2>/dev/null || true
          cp README.md staging/
          cd staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.archive }} .
          else
            tar -czf ../${{ matrix.archive }} .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
